<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LANDORA HOME</title><style>body{font:14px system-ui;width:370px;margin:0;color:#172b42;background:#f6f8fb}header{background:#112d50;color:white;padding:17px;font-weight:700;font-size:18px}main{padding:14px}label{display:block;margin:12px 0 5px;font-weight:600}input,textarea,select{box-sizing:border-box;width:100%;padding:9px;border:1px solid #cdd6e0;border-radius:8px;background:white}textarea{min-height:72px}button{padding:10px;border:0;border-radius:8px;background:#123b68;color:white;cursor:pointer}button.secondary{background:#e8eef5;color:#183450}section{background:white;border-radius:12px;padding:12px;margin-bottom:12px}small{color:#627387}.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.photos{display:flex;flex-direction:column;gap:8px}.photo{padding:8px;border:1px solid #e2e8ef;border-radius:8px}.photo img{width:70px;height:56px;object-fit:cover}.photo .controls{display:flex;gap:4px;align-items:center;flex-wrap:wrap}.photo select{width:125px}.photo button{padding:5px}#status{min-height:20px;color:#285f40}</style></head><body><header>LANDORA HOME <small style="color:#cbd9eb">房仲上架助手 · MVP</small></header><main><section><strong>房源資料</strong><label>房源網址（僅供記錄，不自動抓取）</label><input id="url" type="url" placeholder="https://..."><label>地址</label><input id="address" placeholder="縣市／行政區／路段／門牌"><label>社區名稱（房仲確認）</label><input id="community" placeholder="待核實／無社區／社區名稱"><label>開價（萬元）</label><input id="price" type="number" min="0"><label>格局／坪數</label><input id="layout" placeholder="3房2廳2衛／35.20坪"><label>經紀業合法名稱</label><input id="agency"><label>服務人員／登錄字號</label><input id="agent"><label>聯絡電話</label><input id="phone" type="tel"><label>LINE ID</label><input id="line"><label>廣告內文（自行編輯）</label><textarea id="copy"></textarea></section><section><strong>照片分組與排序</strong><p><small>所有照片僅在此裝置預覽，不上傳伺服器；照片說明由房仲自行決定。</small></p><input id="photos" type="file" accept="image/*" multiple><div id="photoList" class="photos"></div></section><section><strong>發布準備</strong><p><small>此版本不會代替房仲登入其他網站或自動發布。Facebook 粉絲專頁 API 與排程後端待串接。</small></p><div class="actions"><button id="save">儲存草稿</button><button id="draft" class="secondary">產生文案草稿</button><button id="copyBtn" class="secondary">複製刊登文案</button></div><p id="status" role="status"></p></section></main><script src="popup.js"></script></body></html>
